name: Build HackcoTasks Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Capacitor Android Platform
        run: |
          # Remove any leftover reference directories from earlier migrations
          rm -rf android-compose-reference
          # Remove any invalid kts files if accidentally copied
          find android/ -name "*.kts" -delete 2>/dev/null || true

          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
          # Ensure gradlew and wrapper exist inside android/ (extract from official template if missing)
          if [ ! -f "android/gradlew" ]; then
            echo "Restoring gradlew wrapper from Capacitor assets..."
            tar -zxvf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android gradlew gradle/wrapper/ || true
          fi
          chmod +x android/gradlew
          ls -la android/gradlew

      - name: Assemble Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace -b build.gradle -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Locate and Prepare APK
        run: |
          mkdir -p dist-apk
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/HackcoTasks-debug.apk
          else
            find android/ -name "*.apk" -exec cp {} dist-apk/HackcoTasks-debug.apk \;
          fi
          ls -lh dist-apk/

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackcoTasks-Android-APK
          path: dist-apk/*.apk
          retention-days: 30
