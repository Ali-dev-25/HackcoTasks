name: Build HackcoTasks Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Capacitor Android Platform
        run: |
          rm -rf android-compose-reference

          # If android directory is missing or incomplete, initialize it directly from Capacitor's official template
          if [ ! -f "android/build.gradle" ] || [ ! -f "android/settings.gradle" ]; then
            echo "Initializing native Android project from Capacitor template..."
            mkdir -p android
            tar -zxvf node_modules/@capacitor/cli/assets/android-template.tar.gz -C android
          fi

          # Sync web assets to android
          npx cap sync android

          # Ensure gradlew has executable permissions
          chmod +x android/gradlew
          ls -la android/

      - name: Assemble Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"

      - name: Locate and Prepare APK
        run: |
          mkdir -p dist-apk
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/HackcoTasks-debug.apk
          else
            find android/ -name "*.apk" -exec cp {} dist-apk/HackcoTasks-debug.apk \;
          fi
          ls -lh dist-apk/

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackcoTasks-Android-APK
          path: dist-apk/*.apk
          retention-days: 30
