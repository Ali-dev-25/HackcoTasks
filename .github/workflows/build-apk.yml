name: Build HackcoTasks Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync or Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
          # Ensure gradlew exists; if not generate or restore wrapper
          if [ ! -f "android/gradlew" ]; then
            echo "gradlew not found in android/, generating with gradle wrapper..."
            gradle wrapper || gradle wrapper --gradle-version 8.11.1
            mv gradlew android/ 2>/dev/null || true
            mv gradlew.bat android/ 2>/dev/null || true
            mkdir -p android/gradle/wrapper
            mv gradle/wrapper/* android/gradle/wrapper/ 2>/dev/null || true
          fi
          chmod +x android/gradlew || true

      - name: Assemble Debug APK with Gradle
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m"
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Prepare APK
        run: |
          mkdir -p dist-apk
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/HackcoTasks-debug.apk
          else
            find android/ -name "*.apk" -exec cp {} dist-apk/HackcoTasks-debug.apk \;
          fi
          ls -lh dist-apk/

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackcoTasks-Android-APK
          path: dist-apk/*.apk
          retention-days: 30
